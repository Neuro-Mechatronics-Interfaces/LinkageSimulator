<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive planar linkage and finger kinematics prototype" />
    <title>Linkage Simulator</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Linkage Simulator</h1>
            <p>Planar finger mechanism workbench</p>
          </div>
        </div>
        <div class="simulation-actions">
          <button id="play-button" class="primary-button" type="button">Play</button>
          <button id="reset-button" type="button">Reset</button>
          <span id="solver-status" class="status-pill">Ready</span>
        </div>
      </header>

      <main class="workspace-layout">
        <section class="canvas-column" aria-label="Simulation workspace">
          <div class="canvas-toolbar">
            <label>
              Servo angle
              <output id="servo-angle-output">0°</output>
              <input id="servo-angle" type="range" min="-30" max="55" step="1" value="0" />
            </label>
            <label>
              Hand size
              <output id="hand-size-output">100%</output>
              <input id="hand-size" type="range" min="0.72" max="1.32" step="0.01" value="1" />
            </label>
            <label class="toggle-label">
              <input id="construction-toggle" type="checkbox" />
              Construction geometry
            </label>
          </div>
          <div id="canvas-shell" class="canvas-shell">
            <canvas id="simulation-canvas" aria-label="Interactive linkage simulation"></canvas>
            <div class="canvas-help">Drag a link’s right-end handle to drive · wheel to zoom · right-click for actions</div>
            <div id="radial-menu" class="radial-menu" role="menu" aria-label="Canvas actions" hidden></div>
          </div>
        </section>

        <aside class="inspector-panel" aria-label="Component inspector">
          <div class="panel-heading">
            <span>Inspector</span>
            <span id="selection-kind" class="eyebrow">Nothing selected</span>
          </div>
          <div id="inspector-content" class="inspector-content">
            <div class="empty-state">
              <div class="empty-icon">◎</div>
              <p>Select a link, joint, servo, or contactor to inspect it.</p>
            </div>
          </div>
          <div class="legend">
            <h2>Scene key</h2>
            <div><span class="legend-swatch linkage"></span>Linkage</div>
            <div><span class="legend-swatch hand"></span>Hand model</div>
            <div><span class="legend-swatch contact"></span>Finger contact</div>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/ts/main.ts"></script>
  </body>
</html>
